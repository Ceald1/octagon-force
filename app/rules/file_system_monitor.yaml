rules:
  - rule:
    name: shadow deny
    action: "deny"
    filename: "/etc/shadow"
    message: "file: {{FileName}} was accessed by container ID: {{ContainerID}}"
  - rule:
    name: passwd alert
    action: "alert"
    filename: "/etc/passwd"
    message: "file: {{FileName}} was accessed by container ID: {{ContainerID}}"
