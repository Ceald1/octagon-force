apiVersion: v1
kind: ServiceAccount
metadata:
  name: octagon-force-svc
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: octagon-force-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: octagon-force-binding
subjects:
  - kind: ServiceAccount
    name: octagon-force-svc
    namespace: default
roleRef:
  kind: ClusterRole
  name: octagon-force-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: octagon-force-app
  name: octagon-force-app
spec:
  selector:
    matchLabels:
      app: octagon-force-app
  template:
    metadata:
      labels:
        app: octagon-force-app
    spec:
      initContainers:
        - name: wait-for-bpf
          image: busybox:latest
          securityContext:
            privileged: true
          volumeMounts:
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
              readOnly: true
              mountPropagation: HostToContainer # Crucial for seeing live host-side BPF mounts
          command:
            - sh
            - -c
            - |
              TARGET_DIR="/sys/fs/bpf/octagon_force"

              # Wait for directory to exist, then check if item count is > 1
              until [ -d "$TARGET_DIR" ] && [ $(ls -A "$TARGET_DIR" 2>/dev/null | wc -l) -gt 1 ]; do
                 echo "waiting for bpfs in $TARGET_DIR..."
                 sleep 2
              done
              echo "BPF maps detected! Starting container..."

      serviceAccountName: octagon-force-svc
      hostPID: true
      containers:
        - image: ghcr.io/ceald1/octagon-force-app:latest
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          name: octagon-force-app
          env:
            - name: LOKI_HOST
              value: "loki-headless.monitoring.svc.cluster.local:3100"
          volumeMounts:
            # 1. BPF File System
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
              #mountPropagation: Bidirectional
              mountPropagation: HostToContainer
            # 2. Host kernel debug/tracing system
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
            # 3. Host Process filesystem (for monitoring process activity)
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
      volumes:
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate

        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
