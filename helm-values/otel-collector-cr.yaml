apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-prom-collector
  namespace: monitoring
spec:
  mode: statefulset
  replicas: 1
  image: otel/opentelemetry-collector-contrib:0.108.0

  ports:
    - name: loki-http
      port: 3100
      targetPort: 3100
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  targetAllocator:
    enabled: true
    prometheusCR:
      enabled: true
      scrapeProtocols:
        - OpenMetricsText1.0.0
        - OpenMetricsText0.0.1
        - PrometheusText0.0.4
      serviceMonitorSelector: {}
      podMonitorSelector: {}

  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: "target-allocator"
              scrape_protocols:
                - OpenMetricsText1.0.0
                - OpenMetricsText0.0.1
                - PrometheusText0.0.4
              target_allocator:
                endpoint: "http://otel-prom-collector-targetallocator:80"
                interval: 30s
                collector_id: "${POD_NAME}"

      loki:
        protocols:
          http:
            endpoint: "0.0.0.0:3100"

      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      batch:
        send_batch_size: 8192
        timeout: 5s

    exporters:
      otlp:
        endpoint: "signoz-otel-collector.monitoring.svc.cluster.local:4317"
        tls:
          insecure: true

    service:
      telemetry:
        metrics:
          address: "0.0.0.0:8889"
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [otlp]
        logs:
          receivers: [loki]
          processors: [batch]
          exporters: [otlp]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp]

